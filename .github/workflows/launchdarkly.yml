name: LaunchDarkly simulator

on:
  pull_request:
    paths:
      - "launchdarkly/**"
      - ".github/workflows/launchdarkly.yml"
  push:
    paths:
      - "launchdarkly/**"
      - ".github/workflows/launchdarkly.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launchdarkly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launchdarkly/package-lock.json
      - run: npm ci
      - run: npm run verify:spec
      - run: npm run validate:openapi
      - run: npm run generate
      - name: Check generated output
        working-directory: .
        run: git diff --exit-code -- launchdarkly
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - name: Check whitespace
        working-directory: .
        run: git diff --check
