name: CI

on:
  pull_request:
  push:

jobs:
  detect-packages:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.changed.outputs.has_changes }}
      matrix: ${{ steps.changed.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: changed
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          head_sha="${{ github.sha }}"

          if [[ "$base_sha" =~ ^0+$ ]]; then
            if git rev-parse "$head_sha^" >/dev/null 2>&1; then
              base_sha="$(git rev-parse "$head_sha^")"
            else
              base_sha="$(git hash-object -t tree /dev/null)"
            fi
          fi

          mapfile -t packages < <(
            git diff --name-only "$base_sha" "$head_sha" \
              | awk -F/ '{print $1}' \
              | while read -r dir; do
                  [[ -n "$dir" && -f "$dir/package.json" ]] && echo "$dir"
                done \
              | sort -u
          )

          if [[ ${#packages[@]} -eq 0 ]]; then
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
            echo 'matrix={"package":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          matrix_json=$(printf '%s\n' "${packages[@]}" | jq -R . | jq -sc '{package: .}')
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"

  lint-and-test:
    runs-on: ubuntu-latest
    needs: detect-packages
    if: needs.detect-packages.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-packages.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: npm ci

      - name: Lint
        working-directory: ${{ matrix.package }}
        run: npm run lint

      - name: Test
        working-directory: ${{ matrix.package }}
        run: npm test
